name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a stray API key reach CI — the eval suite must stay excluded.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups -p ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --timeout=60 --tb=short

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: threatlens
          POSTGRES_PASSWORD: threatlens
          POSTGRES_DB: threatlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      THREATLENS_TEST_DSN: postgresql://threatlens:threatlens@localhost:5432/threatlens_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Enable pgvector
        run: |
          PGPASSWORD=threatlens psql -h localhost -U threatlens -d threatlens_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # `eval` tests call the Anthropic API. They are non-deterministic and they
      # cost money, so CI never gates on them — see .claude/testing.md.
      - name: Run tests (unit + integration, excluding eval)
        run: uv run pytest -m "not eval" --timeout=120 -v --tb=short

  # ── Gate ──────────────────────────────────────────────────────────────────
  # A single check for branch-protection rules to point at, so adding a new
  # matrix axis or job doesn't require updating repo settings.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Decide pass/fail
        run: |
          echo "lint:         ${{ needs.lint.result }}"
          echo "unit-tests:   ${{ needs.unit-tests.result }}"
          echo "integration:  ${{ needs.integration-tests.result }}"
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "::error::One or more required jobs failed."
            exit 1
          fi
