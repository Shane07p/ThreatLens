services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: threatlens
      POSTGRES_PASSWORD: threatlens
      POSTGRES_DB: threatlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates threatlens_test alongside the main database on first boot
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
