[project]
name = "threatlens"
version = "0.1.0"
description = "A Graph-RAG threat-intelligence agent over the MITRE ATT&CK / CVE knowledge graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.8",
    "stix2>=3.0.2",
    "tenacity>=9.2.1",
    "typer>=0.29.0",
]

[project.scripts]
threatlens = "threatlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatlens"]
# Nested AGENTS.md files are instructions for coding agents working in the source tree,
# not part of the installed package.
exclude = ["**/AGENTS.md"]

[tool.hatch.build.targets.wheel.force-include]
"src/threatlens/graph/schema.sql" = "threatlens/graph/schema.sql"

[dependency-groups]
dev = [
    "diff-cover>=11.0.3",
    "hypothesis>=6.170.15",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs model weights or a large corpus",
    "db: needs a live Postgres with pgvector",
    "eval: calls the Anthropic API, costs tokens",
    "security: asserts a security property; reported in the test-case CSV",
    "negative: asserts a rejection, refusal, or absence; overrides the inferred type",
    "positive: overrides an inferred negative type in the test-case CSV",
    "case(input, expected): states a test's input and expected result for the CSV",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Markdown is documentation, not source. Ruff formats Python blocks inside .md
# files, which rewrites illustrative snippets in the design docs (aligned
# comments, wrapped signatures) purely to satisfy a formatter that will never
# execute them. Config, not a CI flag, so local and CI always agree.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/threatlens"]
# "Type hints on every public function" is a written rule. These two flags make it a
# mechanical one, applied to private helpers too, since a helper's untyped parameter is
# where a wrong type enters a public function.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.mutmut]
# Mutation testing: mutmut makes small deliberate bugs in this code and checks a test fails
# for each. Scoped to the pure, unit-tested modules, where a surviving mutant means a missing
# assertion rather than a missing database. Runs weekly in CI (mutation.yml); needs fork, so
# not on Windows outside WSL.
source_paths = ["src/"]
only_mutate = [
    "src/threatlens/ingest/mappings.py",
    "src/threatlens/ingest/nvd.py",
    "src/threatlens/ingest/attack.py",
    "src/threatlens/eval/metrics.py",
]
pytest_add_cli_args_test_selection = ["-m", "not db and not eval and not slow", "tests/unit/"]
also_copy = ["pyproject.toml"]

[tool.coverage.run]
source = ["threatlens"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

