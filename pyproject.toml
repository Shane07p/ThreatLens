[project]
name = "threatlens"
version = "0.1.0"
description = "A Graph-RAG threat-intelligence agent over the MITRE ATT&CK / CVE knowledge graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
threatlens = "threatlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatlens"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs model weights or a large corpus",
    "db: needs a live Postgres with pgvector",
    "eval: calls the Anthropic API, costs tokens",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
